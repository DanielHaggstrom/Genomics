sample_id: DEMO_SAMPLE_001

inputs:
  cram: /data/wgs/sample.cram
  crai: /data/wgs/sample.cram.crai
  protected_roots: [/data/wgs]

reference:
  build: GRCh38
  bundle_id: grch38_dragen_alt_masked
  # Use a private bundle manifest pointing at the exact CRAM reference.
  bundle_manifest: ../local/reference_bundles/grch38_dragen_alt_masked.yaml

analysis:
  prs:
    score_preset: demo  # Placeholder IDs; replace with real scores before running.
    # Optional: enable imputation only after supplying a compatible local panel.
    imputation:
      enabled: false
  monogenic:
    enabled: false

runtime:
  max_memory: 14.GB
  max_cpus: 8
  min_free_gb: 40
  linux_cache_root: ~/.cache/genomics

outputs:
  results_dir: output/results
  run_id: latest

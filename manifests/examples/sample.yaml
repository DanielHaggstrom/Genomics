sample_id: DEMO_SAMPLE_001

inputs:
  cram: /mnt/c/path/to/DEMO_SAMPLE_001.cram
  crai: /mnt/c/path/to/DEMO_SAMPLE_001.cram.crai

reference:
  build: GRCh38
  bundle_id: grch38_dragen_alt_masked
  autodownload: false
  remote_decode_probe: false

analysis:
  monogenic:
    enabled: true
    mode: moderate
    max_af: 0.05
    vep_forks: 8
  prs:
    enabled: true
    score_preset: demo
    sample_sex: male
    run_ancestry: false
    reference_db: null
    min_overlap: 0.75
    imputation:
      enabled: false
      backend: beagle
      reference_panel: grch38_beagle_panel
      info_threshold: 0.8
      dosage_field: DS

runtime:
  profile: docker
  max_memory: 14.GB
  max_cpus: 8
  min_free_gb: 40
  linux_cache_root: ~/.cache/genomics

outputs:
  results_dir: output/results
  run_id: latest
